<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 210" role="img" aria-label="CSP monogram, Colombo School of Philosophy">
  <!--
    Primary monogram. C and P are the institution's bookends (upright,
    solid); S — "School", the connective middle term — sits smaller,
    raised, and italic, like a note added in dialogue between the two.
    The gently curved rule beneath ties the three into one mark and
    stands in, abstractly, for an open book / horizon / considered
    conclusion — no literal iconography.

    Uses live Literata text (already loaded site-wide). For print or
    third-party production, convert to outlines first so the mark
    renders identically without depending on the font being installed.
  -->
  <text x="15" y="165" font-family="Literata, Georgia, serif" font-weight="600" font-size="130" fill="#33493B">C</text>
  <text x="108" y="100" font-family="Literata, Georgia, serif" font-style="italic" font-weight="500" font-size="68" fill="#9C7A4E">S</text>
  <text x="148" y="165" font-family="Literata, Georgia, serif" font-weight="600" font-size="130" fill="#33493B">P</text>
  <path d="M 20 186 Q 132 178 244 186" fill="none" stroke="#9C7A4E" stroke-width="3" stroke-linecap="round"/>
</svg>
